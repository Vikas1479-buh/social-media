{% extends 'base.html' %}

{% block title %}Notifications - Showcase{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      
      <div class="d-flex justify-content-between align-items-center mb-3 bg-white p-3 rounded-4 shadow-sm">
        <h1 class="h4 fw-bold mb-0 text-dark ms-2">Notifications</h1>
        <button id="mark-all-read-btn" class="btn btn-sm btn-light rounded-pill fw-medium px-3 text-primary" style="color: #E8725A !important;">
          <i class="bi bi-check2-all me-1"></i> Mark all read
        </button>
      </div>

      <!-- Filter tabs -->
      <div class="d-flex gap-2 mb-4 justify-content-start" id="notif-filter-tabs">
        <button type="button" class="btn btn-sm rounded-pill px-3 py-1 fw-semibold notif-filter-btn active" data-filter="all">All</button>
        <button type="button" class="btn btn-sm rounded-pill px-3 py-1 fw-semibold notif-filter-btn" data-filter="requests">Requests</button>
        <button type="button" class="btn btn-sm rounded-pill px-3 py-1 fw-semibold notif-filter-btn" data-filter="activity">Activity</button>
      </div>

      <div id="notifications-list" class="d-flex flex-column gap-3">
        <!-- Skeletons -->
        <div class="card border-0 shadow-sm rounded-4 notification-item unread skeleton bg-white">
          <div class="card-body p-3 d-flex align-items-center gap-3">
            <div class="placeholder-glow">
              <div class="placeholder rounded-circle" style="width: 56px; height: 56px;"></div>
            </div>
            <div class="placeholder-glow flex-grow-1">
              <div class="placeholder col-8 rounded mb-2"></div>
              <div class="placeholder col-4 rounded" style="font-size: 0.8em;"></div>
            </div>
          </div>
        </div>
        <div class="card border-0 shadow-sm rounded-4 notification-item unread skeleton bg-white">
          <div class="card-body p-3 d-flex align-items-center gap-3">
            <div class="placeholder-glow">
              <div class="placeholder rounded-circle" style="width: 56px; height: 56px;"></div>
            </div>
            <div class="placeholder-glow flex-grow-1">
              <div class="placeholder col-7 rounded mb-2"></div>
              <div class="placeholder col-5 rounded" style="font-size: 0.8em;"></div>
            </div>
          </div>
        </div>
      </div>
      
      <div id="notifications-empty" class="text-center py-5 d-none mt-4">
        <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
          <i class="bi bi-bell-slash fs-2 text-muted"></i>
        </div>
        <h3 class="h5 fw-bold text-dark">No notifications yet</h3>
        <p class="text-muted">When you get notifications, they'll show up here.</p>
      </div>

    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
{% endblock %}
