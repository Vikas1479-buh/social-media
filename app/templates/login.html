{% extends 'base.html' %}

{% block title %}Log In — Showcase{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-100 py-5">
  <div class="card shadow-lg border-0 rounded-4 p-4 p-sm-5 bg-white position-relative" style="max-width: 440px; width: 100%;">
    
    <div class="text-center mb-4">
      <a href="{{ url_for('auth.landing') }}" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-3">
        <div class="brand-icon-badge" style="width: 38px; height: 38px; font-size: 1.2rem;">
          <i class="bi bi-camera-fill"></i>
        </div>
        <span class="brand-gradient fs-2 fw-bold">Showcase</span>
      </a>
      <h2 class="h4 fw-bold text-dark mb-1">Welcome back</h2>
      <p class="text-muted small">Log in to your social feed</p>
    </div>
    
    <form id="login-form" aria-label="Log in form">
      <div class="mb-3">
        <label for="login-identifier" class="form-label text-dark fw-medium small mb-1">Email or Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-0 text-muted ps-3"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control form-control-lg rounded-end-3 bg-light border-0 ps-2 fs-6" id="login-identifier" name="identifier" placeholder="you@domain.com or @username" required>
        </div>
      </div>
      
      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="login-password" class="form-label text-dark fw-medium small mb-0">Password</label>
        </div>
        <div class="input-group">
          <span class="input-group-text bg-light border-0 text-muted ps-3"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control form-control-lg bg-light border-0 ps-2 fs-6" id="login-password" name="password" placeholder="Enter your password" required>
          <button class="btn btn-light bg-light border-0 rounded-end-3 toggle-password text-muted pe-3" type="button" aria-label="Toggle password visibility">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>
      
      <div class="d-grid mb-4">
        <button type="submit" class="btn btn-primary-glow btn-lg rounded-pill fw-semibold py-3 fs-6">
          Log In <i class="bi bi-box-arrow-in-right ms-1"></i>
        </button>
      </div>
    </form>
    
    <div class="text-center pt-2 border-top">
      <p class="mb-0 text-muted small">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-decoration-none fw-semibold" style="color: #E8725A;">Create one now</a></p>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
